name: Build macOS Chinese interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 3
      - name: Verify bundle and launch
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          app='build/Nextpad++.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(cat build/fork-version.txt)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NppUpstreamBaseVersion' "$app/Contents/Info.plist")" = "$(cat build/upstream-version.txt)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$GITHUB_RUN_NUMBER"
          echo "version=$(cat build/fork-version.txt)" >> "$GITHUB_OUTPUT"
          bin="$app/Contents/MacOS/Nextpad++"
          lipo "$bin" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          test "$(find "$app/Contents/Resources/icons/reference-toolbar" -name '*.png' | wc -l | tr -d ' ')" = 35
          otool -L "$bin" | tee build/dependencies.txt
          if otool -L "$bin" | awk '/^[[:space:]]/ {print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)'; then
            echo 'Unexpected external runtime dependency'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nextpad-home"
          HOME="$RUNNER_TEMP/nextpad-home" "$bin" -language chineseSimplified >build/launch.log 2>&1 &
          app_pid=$!
          sleep 12
          kill -0 "$app_pid"
          open -a "$app" --args -language chineseSimplified || true
          sleep 3
          screencapture -x build/toolbar-smoke-test.png || true
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Package
        run: |
          mkdir -p dist
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/Nextpad++.app/Contents/Info.plist')
          ditto -c -k --sequesterRsrc --keepParent 'build/Nextpad++.app' "dist/Nextpad-v${version}-macOS.zip"
          hdiutil create -volname 'Nextpad++' -srcfolder 'build/Nextpad++.app' -ov -format UDZO "dist/Nextpad-v${version}-macOS.dmg"
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          cp build/dependencies.txt build/launch.log dist/
          if [ -f build/toolbar-smoke-test.png ]; then cp build/toolbar-smoke-test.png dist/; fi
          shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nextpad-v${{ steps.bundle.outputs.version }}-macOS
          path: dist/
          retention-days: 30
